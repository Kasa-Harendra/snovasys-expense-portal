[build]
builder = "RAILPACK"
buildCommand = "npm install --include=dev --no-audit --no-fund && npm run db:generate && npm run build"

[deploy]
preDeployCommand = "npx prisma migrate deploy --schema=backend/prisma/schema.prisma && npm run bootstrap:admin && npm run db:seed"
startCommand = "npm start"
healthcheckPath = "/api/ready"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
